[project]
name = "hr-hiring-automation"
version = "0.2.0"
description = "Human-supervised, evidence-based resume evaluation and review"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic-settings==2.16.3",
]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv", ".venv-local", ".pytest_cache", "storage"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
